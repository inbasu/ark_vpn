#cloud-config

package_update: true
ssh_pwauth: false
packages: [curl, git, ufw]
users:
  - default
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    sudo:
      - "ALL=(ALL) NOPASSWD: /usr/bin/docker"
      - "ALL=(ALL) NOPASSWD: /usr/bin/git"


runcmd:
  # Environments
  - export HOSTNAME=""
  - export ARKNIGHT=""
  - export PASSWORD=""
  
  # Docker
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - usermod -aG docker deploy
  
  # Deploy stack
   - cd /srv
  - rm -rf ark_vpn
  - git clone --filter=blob:none --sparse https://github.com/inbasu/ark_vpn.git
  - git -C ark_vpn sparse-checkout set "servers/$ARKNIGHT" deploy
  - install -d -o deploy -g deploy "/srv/ark_vpn/servers/$ARKNIGHT/etc/wireguard"
  - chown -R deploy:deploy /srv/ark_vpn

  # Start
  - runuser -l deploy -c "cd /srv/ark_vpn/servers/$STATE && docker compose up -d --wait --wait-timeout 120"
